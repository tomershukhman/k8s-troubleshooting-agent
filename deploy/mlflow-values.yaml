# The MLflow tracking server, kept minimal (MLflow's official chart, oci://ghcr.io/mlflow/charts/mlflow;
# version in AGENT_MLFLOW_CHART_VERSION). `agent setup` installs it with
# `helm upgrade --install --wait`. Everything not listed keeps the chart's default: non-root,
# read-only root filesystem, probes on /health, the Recreate strategy (SQLite on a
# ReadWriteOnce volume).
image:
  # The chart defaults to the -full image (389 MB compressed, arm64); the slim one (298 MB) has
  # everything SQLite and local artifacts need. Pinned by digest (multi-arch index).
  tag: "v3.18.0@sha256:257204c77980b0f3450a26eb6089e487603fcdd4509529eadaf88f90669f5c13"
replicaCount: 1
server:
  value_options:
    host: "0.0.0.0"
    port: 5000
    workers: 1          # chart default 4; one is plenty for a local user
mlflow:
  # Traces survive a pod restart: SQLite and artifacts on the volume below.
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "/mlflow/artifacts"
env:
  # The server's job runner (UI-launched judges, prompt optimization, periodic tasks) starts ~8
  # worker processes of ~230 MB each: 1.8 GiB, OOM-killed at the 1 GiB limit. We run no
  # server-side jobs (the evals score client-side with mlflow.genai.evaluate), so it's off.
  - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
    value: "false"
  # No usage telemetry to MLflow's own servers (on by default); the agent turns it off too.
  - name: MLFLOW_DISABLE_TELEMETRY
    value: "true"
storage:
  enabled: true
  size: 1Gi             # chart default 10Gi; ~20 traces took 2.7 MB
service:
  type: LoadBalancer    # OrbStack exposes it on the Mac's localhost
  # Not 5000: macOS's AirPlay Receiver often listens there, and the browser would reach it instead.
  port: 5050
resources:
  # Measured on OrbStack (kubelet working set): 432 MiB right after start, 390 MiB after ~20
  # traces; CPU ~5m idle, ~22m right after activity.
  requests:
    cpu: 50m
    memory: 448Mi
  limits:
    memory: 1Gi
