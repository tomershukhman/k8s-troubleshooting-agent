[project]
name = "k8s-agent"
version = "0.1.0"
description = "Kubernetes troubleshooting agent: read-only investigation, evals, one approved fix"
authors = [
    { name = "Tomer Shukhman", email = "tomer.shukhman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.6",
    "gitpython>=3.1",
    "kubernetes>=37.0.2,<38",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain[mcp]>=1.4.9",
    "langgraph>=1.2.20",
    "langgraph-checkpoint>=4.3.1",
    "mlflow-tracing>=3.18.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
# `agent eval` only: mlflow.genai.evaluate and its judges. The agent itself traces with the slim
# mlflow-tracing package above.
eval = ["mlflow>=3.18.0"]

[project.scripts]
agent = "k8s_agent.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "k8s-agent[eval]",
    "pyright[nodejs]==1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
# Bare `pytest` runs unit tests only; acceptance tests need a cluster (`make accept`).
testpaths = ["tests/unit"]
addopts = "-ra"
filterwarnings = [
    # langsmith's pytest plugin (installed with langchain) on Python 3.14; not our code
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
    # mlflow (eval extra) on import, with SQLAlchemy 2.1; not our code
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PERF", "ASYNC", "RUF", "S"]
# Mutable class defaults are safe on pydantic models, which copy them per instance.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, run the CLI and helm/kubectl/docker by name, use fake tokens and open local URLs.
"tests/**" = ["S101", "S603", "S607", "S106", "S310"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# MLflow loads its submodules lazily (mlflow.genai, mlflow.entities, ...); this rule flags each one.
reportPrivateImportUsage = false
