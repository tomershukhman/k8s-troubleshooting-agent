# The namespace, labelled as ours (`scenario up|down` touch no other), and the agent's access.
apiVersion: v1
kind: Namespace
metadata:
  name: shop-checkout
  labels: {app.kubernetes.io/part-of: k8s-agent-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: k8s-agent-reader, namespace: shop-checkout}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: reader, namespace: k8s-agent}]
---
# Fixes are allowed here only (AGENT_REMEDIATION_NAMESPACES).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: k8s-agent-remediator, namespace: shop-checkout}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: k8s-agent-remediate}
subjects: [{kind: ServiceAccount, name: remediator, namespace: k8s-agent}]
