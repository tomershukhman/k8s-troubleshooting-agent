# The evals with the real model, on a throwaway kind cluster, through the README's own
# `docker compose` commands and the image built from this code (SPEC 1, CI). On every pull
# request to main, and from the Actions tab's "Run workflow" button.
name: eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the pull request cancels the run in progress: only the latest code is paid for.
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # GitHub gives secrets to no pull request from a fork: there the evals don't run.
  key:
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY secret (e.g. a pull request from a fork): the evals didn't run. Run them locally: docker compose run --rm admin eval"
          fi

  eval:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The settings a reviewer puts in .env. Native Linux Docker: the containers run as the
      # owner of the 0600 kubeconfigs.
      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          AGENT_CONTAINER_USER=$(id -u):$(id -g)
          AGENT_KUBE_CONTEXT=kind-k8s-agent
          MLFLOW_TRACKING_URI=http://localhost:5050
          EOF
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: k8s-agent
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image the compose services use, built from this code (ci.yml's cache makes it quick).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: GIT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
      - name: agent setup (the agent's identities)
        run: docker compose run --rm -T admin setup
      - name: Start the MCP server and the tracking server
        run: docker compose up -d --wait k8s-mcp mlflow
      - name: agent eval
        run: docker compose run --rm -T admin eval
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-results/*.json
          if-no-files-found: ignore
