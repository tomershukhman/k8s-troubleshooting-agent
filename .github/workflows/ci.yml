# The pipeline, one stage after another (DESIGN 3.11):
#   lint → unit tests → build image → publish image → mlflow evals → mark evaluated
# Pull requests to main (and the Actions tab's "Run workflow" button) run every stage. The image
# is published as a candidate under its commit SHA; the evals pull that image, and once they pass
# it is also tagged with the hash of its files (the git tree), marking it evaluated.
# Pushes to main and v* tags build nothing: they promote the evaluated image whose files are the
# commit's own (latest on main, the tag's name for v*), so what ships is the image that was graded.
# Main only takes pull requests that are up to date with it, so a merge commit has exactly the
# files a pull request's last run evaluated.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress: only the latest code is paid for.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The commit stamped into the image (AGENT_GIT_COMMIT, on traces): a pull request's own head,
  # which stays in main's history after the merge, rather than GitHub's temporary test merge.
  # Up to date with main, both have the same files.
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Pushes (main, v* tags) only promote; every later stage needs this one, so they skip too.
  lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make lint

  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make test
        env:
          PYTEST_ADDOPTS: -rA  # list every test by name, passed ones too

  build-image:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: GIT_COMMIT=${{ env.SOURCE_COMMIT }}
          # The same amd64 layers publish builds: one cache scope per platform, shared.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: Run the image as its default, non-root user
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:ci" -u)
          echo "runs as uid $uid"
          test "$uid" != 0
          docker run --rm "$IMAGE:ci" scenario list

  # Publishes the candidate under its commit SHA only: latest and v* tags come from promote.
  # Pull requests from forks get no write token (or secrets): publish and evals don't run there.
  # Each platform builds natively on its own runner and pushes by digest (no QEMU); publish-image
  # then joins the digests into one multi-arch image under the tags (Docker's multi-runner pattern).
  publish-platform:
    needs: build-image
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: publish-platform (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same tag rules as publish-image, so the labels (version among them) match.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: GIT_COMMIT=${{ env.SOURCE_COMMIT }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # A required check: it runs even when a platform build failed (a skipped check counts as
  # passed), and fails then.
  publish-image:
    needs: publish-platform
    if: >-
      !cancelled() && github.event_name != 'push' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Both platforms built
        run: test "${{ needs.publish-platform.result }}" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ github.sha }}
      - name: Create the multi-arch image under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # one word per -t flag and digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"

  # The README's own docker compose commands, with the real model, on a throwaway kind cluster.
  mlflow-evals:
    needs: publish-image
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The settings a user puts in .env. Native Linux Docker: the containers run as the
      # owner of the 0600 kubeconfigs.
      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run the evals"
            exit 1
          fi
          umask 077
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          AGENT_CONTAINER_USER=$(id -u):$(id -g)
          MLFLOW_TRACKING_URI=http://localhost:5050
          EOF
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: k8s-agent
      # The image just published, under the name compose uses.
      - name: Pull the published image
        run: |
          docker pull "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
      - name: agent setup (the agent's identities)
        run: docker compose run --rm -T admin setup
      - name: Start the MCP server and the tracking server
        run: docker compose up -d --wait k8s-mcp mlflow
      - name: agent eval
        run: docker compose run --rm -T admin eval
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-results/*.json
          if-no-files-found: ignore

  # The candidate passed: tag the same image (no rebuild) with the hash of its files, so a push
  # with exactly these files can promote it. Its own job, so the evals never hold a write token.
  mark-evaluated:
    needs: mlflow-evals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the evaluated image with its tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          docker buildx imagetools create -t "$IMAGE:tree-$tree" "$IMAGE:$GITHUB_SHA"
          echo "evaluated: $IMAGE:tree-$tree"

  # Pushes to main and v* tags: no build. Promote the evaluated image whose files are this
  # commit's, under latest (main) or the tag's name (v*), and the commit's SHA. No evaluated
  # image (a fork's pull request, which skips the evals): fail, rather than ship one unevaluated.
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the evaluated image
        env:
          NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! docker buildx imagetools inspect "$IMAGE:tree-$tree" > /dev/null; then
            echo "::error::No evaluated image has this commit's files (tree $tree)." \
              "Run the evals on a pull request with exactly these files, then merge it."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$NAME" -t "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:tree-$tree"
          docker buildx imagetools inspect "$IMAGE:$NAME"
