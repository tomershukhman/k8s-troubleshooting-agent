# The pipeline, one stage after another (SPEC 1, CI):
#   lint → unit tests → build image → publish image → mlflow evals
# The evals pull the image just published, so they grade the artifact that ships. Pull requests
# to main run every stage; pushes to main and v* tags stop after publishing (latest on main); the
# Actions tab's "Run workflow" button runs every stage.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress: only the latest code is paid for.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make lint

  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make test
        env:
          PYTEST_ADDOPTS: -rA  # list every test by name, passed ones too

  build-image:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          # The amd64 layers publish builds: the GitHub Builder's scope for linux/amd64.
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,mode=max,scope=image-linux-amd64
      - name: Run the image as its default, non-root user
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:ci" -u)
          echo "runs as uid $uid"
          test "$uid" != 0
          docker run --rm "$IMAGE:ci" scenario list

  # Every run publishes under its commit SHA; main also as latest, a v* tag under its name.
  # Pull requests from forks get no write token (or secrets): publish and evals don't run there.
  # Docker's GitHub Builder builds each platform natively on its own runner (arm64 on
  # ubuntu-24.04-arm, no QEMU), then joins them into one multi-arch image under the tags.
  publish:
    needs: build-image
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      packages: write
      id-token: write  # signs the attestations with GitHub's OIDC token
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: GIT_COMMIT=${{ github.sha }}
      cache: true
      cache-scope: image
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=${{ github.sha }}
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=tag
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The check branch protection requires (the builder's checks are named publish / …). It runs
  # even when the builder failed (a skipped check counts as passed), and fails then.
  publish-image:
    needs: publish
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The builder published the image
        run: test "${{ needs.publish.result }}" = success
      - run: docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"

  # The README's own docker compose commands, with the real model, on a throwaway kind cluster.
  mlflow-evals:
    needs: publish-image
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The settings a reviewer puts in .env. Native Linux Docker: the containers run as the
      # owner of the 0600 kubeconfigs.
      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run the evals"
            exit 1
          fi
          umask 077
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          AGENT_CONTAINER_USER=$(id -u):$(id -g)
          MLFLOW_TRACKING_URI=http://localhost:5050
          EOF
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: k8s-agent
      # The image just published, under the name compose uses.
      - name: Pull the published image
        run: |
          docker pull "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
      - name: agent setup (the agent's identities)
        run: docker compose run --rm -T admin setup
      - name: Start the MCP server and the tracking server
        run: docker compose up -d --wait k8s-mcp mlflow
      - name: agent eval
        run: docker compose run --rm -T admin eval
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-results/*.json
          if-no-files-found: ignore
